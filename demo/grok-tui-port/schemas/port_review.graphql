type PortReview {
  run_id: String @index @immutable
  review_id: String @index(unique: true) @immutable
  work_unit_id: String @immutable
  logical_unit_id: String @index @immutable
  implementation_id: String @immutable
  workspace_id: String @immutable
  attempt: String @immutable
  verdict: String @immutable
  grok_call_site_checked: String @immutable
  evidence: String @immutable
  notes: String @immutable
  expected_total: String @immutable
}
