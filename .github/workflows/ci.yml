name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      full_candidate:
        description: Run the full non-PR candidate suites.
        required: true
        type: boolean
        default: true
      candidate_sha:
        description: Exact 40-character commit SHA expected at the dispatched ref.
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Each 32-core Studio runs at most two gents jobs concurrently. Keep eight
  # cores free for the OS and other host services.
  CARGO_BUILD_JOBS: ${{ vars.CARGO_BUILD_JOBS || '12' }}
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TARGET_ROOT: ${{ vars.CARGO_TARGET_ROOT || '/Users/admin/.cache/gents-cargo-target' }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  LEAN_CACHE_ROOT: ${{ vars.LEAN_CACHE_ROOT || '/Users/admin/.cache/gents-lean' }}
  RUSTC_WRAPPER: sccache
  RUST_BACKTRACE: "1"
  SCCACHE_CACHE_SIZE: ${{ vars.SCCACHE_CACHE_SIZE || '120G' }}
  # The host service and clients normalize every registered checkout root.
  SCCACHE_BASEDIRS: ${{ vars.SCCACHE_BASEDIRS }}
  SCCACHE_DIR: ${{ vars.SCCACHE_DIR || '/Users/admin/.cache/sccache' }}

jobs:
  rename-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify immutable full-candidate dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FULL_CANDIDATE: ${{ inputs.full_candidate }}
        run: |
          set -euo pipefail
          if [[ "${FULL_CANDIDATE}" != "true" ]]; then
            echo "::error::Manual CI dispatches must select full_candidate."
            exit 1
          fi
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full lowercase 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::candidate_sha ${CANDIDATE_SHA} does not match checked-out GITHUB_SHA ${GITHUB_SHA}."
            exit 1
          fi

      - name: Check rename tool syntax
        run: bash -n scripts/rename-to-gents.sh

      - name: Run rename tool self-test
        run: scripts/rename-to-gents.sh self-test

      - name: Reject stale product identifiers
        run: scripts/rename-to-gents.sh guard all

      - name: Check Harbor runner syntax
        run: |
          bash -n scripts/harbor/run_gents.sh
          bash -n scripts/measure-gents-binary.sh
          bash -n scripts/measure-gents-build-attribution.sh
          shellcheck -s sh scripts/harbor/run_gents.sh
          shellcheck scripts/measure-gents-binary.sh
          shellcheck scripts/measure-gents-build-attribution.sh

      - name: Run Harbor runner self-test
        run: scripts/harbor/run_gents.sh self-test

      - name: Run build attribution parser self-test
        run: scripts/measure-gents-build-attribution.sh self-test

      - name: Run Harbor agent adapter tests
        run: python3 scripts/harbor/test_gents_agent.py

  rust-and-cli:
    name: rust-and-cli (${{ matrix.suite }})
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.position == github.event.pull_request.stack.size
    needs: rename-guard
    runs-on:
      [
        self-hosted,
        macOS,
        ARM64,
        studio,
        "${{ matrix.host }}",
        "${{ matrix.slot }}",
      ]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep each suite on one runner process so both the host-local
          # sccache and that process's linked Cargo artifacts stay warm. Pair
          # a heavy suite with a lighter one on each physical Studio.
          - suite: runtime
            host: studio-1
            slot: ci-runtime
            cargo_incremental: "1"
            # sccache rejects rustc incremental mode rather than passing it
            # through, so the persistent target tree owns these rebuilds.
            rustc_wrapper: .github/scripts/rustc-direct.sh
          - suite: support
            host: studio-1
            slot: ci-support
            cargo_incremental: "1"
            # Shared sccache can return a stale module graph when a checkout
            # adds a Rust module. The persistent target still keeps external
            # dependencies warm after the support script cleans workspace
            # members, so compile local crates directly for correctness.
            rustc_wrapper: .github/scripts/rustc-direct.sh
          - suite: desktop
            host: studio-2
            slot: ci-desktop
            cargo_incremental: "1"
            rustc_wrapper: .github/scripts/rustc-direct.sh
          - suite: cli
            host: studio-2
            slot: ci-cli
            cargo_incremental: "1"
            rustc_wrapper: .github/scripts/rustc-direct.sh
    # A cold runner instance must compile and link every Rust target. Each
    # runner process owns a durable target directory; the short support suite
    # also uses the host-shared sccache service.
    timeout-minutes: 180
    env:
      # RUSTC_WRAPPER controls this Cargo process; the config-form override is
      # inherited by recursive Cargo invocations from build scripts.
      CARGO_BUILD_RUSTC_WRAPPER: ${{ matrix.rustc_wrapper }}
      CARGO_INCREMENTAL: ${{ matrix.cargo_incremental }}
      RUSTC_WRAPPER: ${{ matrix.rustc_wrapper }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # gents-migration's build script compiles the fixture lens for WASM and
      # is in the dependency graph of every heavy suite. Install the target
      # explicitly instead of relying on mutable host toolchain state.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Install elan
        # Runtime conformance and desktop-bridge tests both load the generated
        # Lean contract. The FULL CLI suite (main pushes only — PR runs use
        # the smoke subset) loads it too, via gents-cli's lean_apply_write_
        # boundary and identity_decide fences.
        if: matrix.suite == 'runtime' || matrix.suite == 'desktop' || (matrix.suite == 'cli' && github.event_name != 'pull_request')
        run: |
          .github/scripts/setup-elan.sh
          cargo_dir="$(dirname "$(rustup which cargo)")"
          echo "${cargo_dir}" >> "$GITHUB_PATH"
          "${cargo_dir}/cargo" --version

      - name: Install protobuf compiler
        run: .github/scripts/setup-protoc.sh

      - name: Prepare disk-backed Rust build cache
        run: .github/scripts/setup-rust-build-cache.sh

      # Runtime conformance and desktop-bridge tests load the generated Lean
      # contract. Mathlib publishes matching precompiled artifacts; without
      # this cache Lake recompiles the dependency graph in every clean checkout.
      - name: Prepare persistent Lean build cache
        if: matrix.suite == 'runtime' || matrix.suite == 'desktop' || (matrix.suite == 'cli' && github.event_name != 'pull_request')
        run: .github/scripts/setup-lean-build-cache.sh

      - name: Download precompiled Mathlib artifacts
        if: matrix.suite == 'runtime' || matrix.suite == 'desktop' || (matrix.suite == 'cli' && github.event_name != 'pull_request')
        working-directory: crates/gents/proofs
        # Lean 4.18's LLVM 15 linker emits a native cache executable that
        # macOS 26 rejects. Running the same checked-in entry point through the
        # interpreter avoids that dyld incompatibility without changing tools.
        run: |
          lake build Cache.Main
          lake env lean --run .lake/packages/mathlib/Cache/Main.lean get

      - name: Check formatting
        if: matrix.suite == 'support'
        run: cargo fmt --all --check

      - name: Assert native-e2e excluded from production capabilities
        if: matrix.suite == 'support'
        run: ./scripts/check-native-e2e-capabilities.sh

      - name: Verify Rust CI covers every workspace package
        if: matrix.suite == 'support'
        run: .github/scripts/check-rust-ci-package-coverage.sh

      - name: Record Rust dependency graph metrics
        if: matrix.suite == 'support'
        env:
          MEASURE_MODE: graph
          OUTPUT_JSON: ${{ runner.temp }}/gents-build-graph-${{ github.sha }}.json
        run: |
          scripts/measure-gents-binary.sh
          jq -e '
            .schema_version == 2
            and .dependencies.root_package == "gents-cli"
            and .dependencies.target == .target_triple
            and .dependencies.normal_packages > 0
            and .dependencies.all_target_normal_packages >= .dependencies.normal_packages
            and (.dependencies.duplicate_packages | length) == .dependencies.duplicate_package_names
          ' "${OUTPUT_JSON}" >/dev/null

      - name: Upload Rust dependency graph metrics
        if: matrix.suite == 'support'
        uses: actions/upload-artifact@v7
        with:
          name: gents-build-graph-${{ github.sha }}
          path: ${{ runner.temp }}/gents-build-graph-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30

      # Together these four jobs compile and link the FULL workspace target
      # surface — examples, benches, every test target, and the desktop crates.
      # This preserves the #646 construction-site fence without doing a
      # metadata-only cargo check pass before the test-profile build.
      - name: Compile and link runtime targets
        if: matrix.suite == 'runtime'
        run: .github/scripts/compile-rust-ci-suite.sh runtime

      - name: Run proof conformance tests
        if: matrix.suite == 'runtime'
        # DefraDB operations can exceed the platform-default worker stack.
        # Production runtimes reserve 16 MiB for the same work; keep the
        # conformance gate representative and deterministic under parallelism.
        env:
          RUST_MIN_STACK: 16777216
        run: cargo test -p gents --test conformance

      - name: Compile and link CLI targets
        if: matrix.suite == 'cli'
        run: .github/scripts/compile-rust-ci-suite.sh cli

      - name: Compile and link desktop targets
        if: matrix.suite == 'desktop'
        run: .github/scripts/compile-rust-ci-suite.sh desktop

      - name: Compile and link support targets
        if: matrix.suite == 'support'
        run: .github/scripts/compile-rust-ci-suite.sh support

      - name: Build the WASM lens target
        if: matrix.suite == 'support'
        run: |
          cargo build -p gents-lens-fixture-add-label --target wasm32-unknown-unknown
          cargo build -p gents-callback-fixture-create-workspace --target wasm32-unknown-unknown

      # Every workspace package whose tests are not run by the runtime, cli, or
      # desktop steps below. The package-coverage guard above only proves each
      # package is COMPILED; without this these suites build and never execute,
      # so a broken assertion in them can survive indefinitely.
      - name: Run support package tests
        if: matrix.suite == 'support'
        # --no-fail-fast: a node flake in gents-migration must not mask the
        # 140 pure gents-protocol/gents-schemas assertions that run after it.
        run: |
          cargo test --no-fail-fast \
            -p gents-migration \
            -p gents-lens-fixture-add-label \
            -p gents-callback-fixture-create-workspace \
            -p gents-protocol \
            -p gents-schemas \
            -p gents-codex-protocol \
            -p gents-chatgpt-login \
            -p gents-claude-login \
            -p gents-fs-runner \
            -p gents-lean-contract

      - name: Run PR runtime smoke tests
        if: matrix.suite == 'runtime' && github.event_name == 'pull_request'
        run: |
          cargo test -p gents --lib runtime_status::tests::
          cargo test -p gents --lib toolset::tests::read_only_bash
          cargo test -p gents --lib callback::
          # The client-authored list-sync fence (#1123/#1125) must fail the
          # PR that drifts the surface, not the post-merge main run.
          cargo test -p gents --test misc client_authored_collections_fence::

      - name: Run PR CLI smoke tests
        if: matrix.suite == 'cli' && github.event_name == 'pull_request'
        run: |
          cargo test -p gents-cli --test cli_server server_startup_with_iroh_p2p_reports_runtime_connectivity -- --nocapture --test-threads=1
          cargo test -p gents-cli --test cli_runtime cli_status:: -- --nocapture --test-threads=1
          cargo test -p gents-cli --test cli_runtime cli_reconciliation::reconciled_runtime_sends_generation_two_tools_and_completes_tool_loop -- --nocapture --test-threads=1

      - name: Run full library and integration tests
        if: matrix.suite == 'runtime' && github.event_name != 'pull_request'
        env:
          RUST_MIN_STACK: 16777216
        run: cargo test --no-fail-fast -p gents --lib --tests

      - name: Run desktop Rust package tests
        if: matrix.suite == 'desktop'
        # --no-fail-fast: the client_core iroh dial must not mask the 15
        # binaries and the tauri lib tests that run after it.
        run: |
          cargo test --no-fail-fast \
            -p gents-desktop-core \
            -p gents-desktop \
            -p gents-desktop-bridge \
            -p fixture-domain-plugin \
            -p gents-fixture-host
          cargo test --no-fail-fast -p gents-desktop-tauri --lib

      - name: Run full CLI test suite
        if: matrix.suite == 'cli' && github.event_name != 'pull_request'
        # --no-fail-fast: cli binaries run alphabetically; without this the
        # first red binary hides every later one (how a broken cli_subagent
        # masked cli_trace_export for days — see #1139).
        run: cargo test --no-fail-fast -p gents-cli -- --nocapture --test-threads=1

      - name: Show Rust build cache stats
        # The three heavy suites use runner-local incremental state. Keep one
        # cache-health report for the support shard and non-CI Studio users.
        if: always() && matrix.suite == 'support'
        run: .github/scripts/show-sccache-stats.sh

  lean-proofs:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.position == github.event.pull_request.stack.size
    # Reuse the warm proof cache on studio-1's light support slot. This keeps
    # the runtime slot free once rename-guard releases the Rust matrix.
    runs-on: [self-hosted, macOS, ARM64, studio, studio-1, ci-support]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install elan
        run: .github/scripts/setup-elan.sh

      - name: Prepare persistent Lean build cache
        run: .github/scripts/setup-lean-build-cache.sh

      - name: Download precompiled Mathlib artifacts
        working-directory: crates/gents/proofs
        run: |
          lake build Cache.Main
          lake env lean --run .lake/packages/mathlib/Cache/Main.lean get

      - name: Reject Lean sorry placeholders
        working-directory: crates/gents/proofs
        run: |
          if find . -type f -name '*.lean' -exec grep -n -E '(^|[^[:alnum:]_])sorry([^[:alnum:]_]|$)' {} +; then
            echo "::error::Lean proof sources must not contain sorry placeholders."
            exit 1
          fi

      - name: Build proofs
        working-directory: crates/gents/proofs
        run: lake build

      # The chat package consumes the generated ClientShell contract. Running
      # this test after the proof build reuses the persistent Lake cache; on a
      # cold hosted runner, the same collection step takes roughly 10 minutes.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace frontend dependencies
        run: npm ci

      - name: Build desktop package dependencies
        run: |
          npm run build --workspace @source-inc/gents-desktop-client
          npm run build --workspace @source-inc/gents-desktop-ui
          npm run build --workspace @source-inc/gents-desktop-chat

      - name: Run Lean-backed desktop chat conformance tests
        run: npm test --workspace @source-inc/gents-desktop-chat

  desktop-packages:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.position == github.event.pull_request.stack.size
    # Package boundary, publishability, and package-local tests are independent
    # of the desktop application/browser gate and should not block it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace frontend dependencies
        run: npm ci

      - name: Check desktop package boundaries
        run: npm run check:package-boundaries

      - name: Build desktop packages
        run: npm run build:packages

      # The chat package's Lean-backed conformance test runs in lean-proofs so
      # it can reuse that job's already-built, persistent proof cache.
      - name: Run desktop package tests
        run: |
          npm run test --workspace @source-inc/gents-desktop-client
          npm run test --workspace @source-inc/gents-desktop-ui
          npm run test --workspace @source-inc/gents-desktop-fleet
          npm run test --workspace @source-inc/gents-desktop-operations

      - name: Build desktop fixture host
        run: npm run build --workspace @source-inc/fixture-host-ui

      - name: Verify packed desktop packages
        # Exercise the same relative output path used by the release workflow.
        run: ./scripts/pack-desktop-packages.sh target/desktop-npm-ci

  desktop-ui:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.position == github.event.pull_request.stack.size
    # This job exercises browser-only code. Keep scarce macOS capacity for the
    # Rust/Lean work that benefits from persistent host caches.
    name: desktop-ui (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, browser]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace frontend dependencies
        run: npm ci

      # The application imports the workspaces through their dist exports, so
      # each isolated shard prepares those small build products locally.
      - name: Build desktop packages
        run: npm run build:packages

      - name: Install Playwright browser
        if: matrix.suite == 'browser'
        working-directory: apps/gents-desktop
        run: npx playwright install --with-deps chromium

      - name: Check desktop formatting
        if: matrix.suite == 'unit'
        working-directory: apps/gents-desktop
        run: npm run format:check

      - name: Build desktop frontend
        working-directory: apps/gents-desktop
        run: npm run build

      - name: Run desktop unit tests
        if: matrix.suite == 'unit'
        working-directory: apps/gents-desktop
        run: npm test

      - name: Run desktop browser journeys
        if: matrix.suite == 'browser'
        working-directory: apps/gents-desktop
        run: npm run test:ui:e2e

      # Only deterministic shape assertions fail this lane. Wall-clock and
      # resource measurements remain evidence until runner stability is known.
      - name: Check mobile interaction structural budgets
        if: matrix.suite == 'browser'
        working-directory: apps/gents-desktop
        run: npm run perf:mobile -- --runs=3 --output=test-results/mobile-performance/ci

      - name: Upload desktop UI artifacts
        if: failure() && matrix.suite == 'browser'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ui-artifacts
          if-no-files-found: ignore
          path: |
            apps/gents-desktop/test-results
            apps/gents-desktop/playwright-report
            apps/gents-desktop/playwright-screenshots-report

  desktop-ui-bombadil:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.position == github.event.pull_request.stack.size
    # Bombadil's exact Linux failure trace passes on macOS. Keep this small
    # platform-specific smoke on a Studio while the portable UI suite runs on
    # hosted Linux; it normally releases the slot before Rust becomes ready.
    # Keep the heavier desktop Rust slot available; the CLI shard is short and
    # can wait for this platform-specific smoke test to release its runner.
    runs-on: [self-hosted, macOS, ARM64, studio, studio-2, ci-cli]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace frontend dependencies
        run: npm ci

      - name: Build desktop packages
        run: npm run build:packages

      - name: Install Playwright browser
        working-directory: apps/gents-desktop
        run: npx playwright install chromium

      - name: Run desktop Bombadil smoke
        working-directory: apps/gents-desktop
        run: npm run test:ui:fuzz -- --time-limit 30s

      # Bombadil has no --seed; the recorded trace is the only exact-replay
      # handle. Upload it on success too so a failing run can be bisected
      # against a known-good trace (npm run test:ui:fuzz -- --reproduce <dir>).
      - name: Upload Bombadil trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ui-bombadil-trace
          if-no-files-found: ignore
          retention-days: 30
          path: apps/gents-desktop/test-results/bombadil

  triage-hygiene:
    # The issue-triage bot holds `issues: write` and runs on a daily cron. These
    # tests are the only fence on its decision function, so every pull request
    # must run them.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The triage scripts import `node:` built-ins only, so this job needs no
      # `npm ci` and therefore no npm cache.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run triage-hygiene tests
        run: npm run test:triage
