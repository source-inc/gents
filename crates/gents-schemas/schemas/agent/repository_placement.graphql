# Maps a logical repository_id to this host's checkout. Local-only (NOT
# @branchable): never derive repository_id from a credential-bearing remote.
type RepositoryPlacement {
    repository_id: String @index(unique: true)
    deployment_id: String @index
    host_path: String
    enabled: Boolean @index
    updated_at: DateTime @index(direction: DESC)
}
