# Desired-state WASM planner module. `wasm_bytes` is standard base64 of the
# decoded module (GraphQL String cannot carry raw NUL/non-UTF-8). `module_id`
# is content-addressed over (decoded bytes, canonical_args, abi_version).
# Resource limits deny execution; they do not mint capabilities.
type CallbackModule @branchable {
    module_id: String @index(unique: true)
    abi_version: Int
    wasm_bytes: String
    canonical_args: String
    signer_did: String @index
    provenance: String
    enabled: Boolean @index
    fuel_limit: Int
    memory_pages: Int
    max_input_bytes: Int
    max_output_bytes: Int
    created_at: DateTime @index(direction: DESC)
    updated_at: DateTime @index(direction: DESC)
}
