# The durable fact record for one provider call: the exact rendered request,
# persisted before it is sent. `Proofs/RenderedCapture.lean` fences the order —
# a send is legal only after the matching (capture_key, canonical request) is
# durable, and one capture key names at most one canonical request.
#
# `@branchable` is deliberate and immutable for this collection version.
# DefraDB rejects every patch that flips `is_branchable`; changing it therefore
# requires an explicit successor or destructive reset. It is NOT what produces
# the content address for `request_json`: per-field and composite commit blocks
# are written unconditionally, and `is_branchable` gates only the extra
# collection-level block. It is taken for two capabilities this fact record may
# need and could not acquire in place: peer-initiated branchable collection
# catch-up, which rejects non-branchable collections, and collection-scoped ACP
# decisions. Ordinary replicator creation can also push existing documents from
# non-branchable collections, so branchability is not the only backfill path.
#
# There is deliberately no `request_hash` column. A stored digest is
# self-attested: the same writer chooses both the bytes and the digest over
# them, so it proves nothing an auditor could not have been lied to about.
# Integrity comes from the DefraDB field commit CID for `request_json`, which is
# computed over the block that was actually stored and replicates with it.
#
# No `@policy` and no encryption directives. A policy cannot be added to this
# collection version later; it will require a successor collection. Runtime
# installation is also blocked on defradb.rs#1318
# (`EmbeddedNode` exposes no policy or relationship API), and a policy id that
# is never installed deploys cleanly while leaving rows anonymously readable.
# `encrypt: true` protects replicated CRDT block deltas only — the local node
# writes plaintext into the datastore — so it would be confidentiality theater
# on a single-node install. #840's participant-boundary criterion is therefore
# NOT met by this collection as shipped.
type RenderedRequest @branchable {
    # sha256 over the canonical (agent_did, session_id, request_scope,
    # turn_index, attempt) tuple, where `request_scope` is the injective JSON
    # pair `[request_doc_id, capture_scope]`. Unique: exactly one capture per
    # provider attempt, ever. Reusing this key with a different canonical
    # request is an integrity error, never an update.
    capture_key: String @index(unique: true) @immutable
    # Exact DefraDB `_docID` of the durable AgentRequest. This is the durable
    # provenance edge; request_id below remains the logical/user-facing id.
    # Empty only for one-shot runs, which do not author an AgentRequest.
    request_doc_id: String @index @immutable
    # Composite commit CID and cryptographically verified signer DID of the
    # sole AgentRequest source head admitted before claim. These name the
    # immutable authored input; requester_did remains attribution, not proof.
    # Empty only for a one-shot run.
    request_source_commit_cid: String @immutable
    request_source_signer_did: String @index @immutable
    # Composite commit CID and cryptographically verified signer DID of the
    # target-agent claim snapshot the runtime consumed. The claim commit has
    # exactly request_source_commit_cid as its sole composite parent.
    request_claim_commit_cid: String @immutable
    request_claim_signer_did: String @index @immutable
    # Exact signed running InferenceCall snapshot whose admission permit
    # authorized this provider send. These are empty only for explicit test or
    # static fixtures; every production send, including one-shot, fails closed
    # before the transport when this evidence is unavailable.
    inference_call_doc_id: String @index @immutable
    inference_call_composite_commit_cid: String @immutable
    inference_call_signer_did: String @index @immutable
    request_id: String @index @immutable
    session_id: String @index @immutable
    agent_did: String @index @immutable
    requester_did: String @immutable
    behavior_id: String @immutable
    # Which completion loop inside the request issued this provider call.
    # `inference.N` is the request's own loop; `compaction.N` and
    # `compaction_fallback.N` are the summarizer that produces the ephemeral
    # continuation checkpoint; `title.N` and `oneshot.N` are the rest. Each loop
    # starts its own turn/attempt counters at zero, so without this component
    # the summarizer's first call and the request's first turn would be one
    # fact. Deliberately unindexed: it is low cardinality and always reachable
    # behind the `request_id` and `session_id` indexes, and this is a hot,
    # large-payload write path.
    capture_scope: String @immutable
    # The owned completion loop's turn and retry counters. Neither is
    # `InferenceCall.attempt`; they count different things.
    turn_index: Int @immutable
    attempt: Int @immutable
    # Capture format version. Gates how `provenance_json` is interpreted; an
    # unsupported version is reported, never silently reinterpreted.
    capture_version: Int @immutable
    model_name: String @immutable
    # Provider wire shape the request was sent on, e.g. openai_responses or
    # openai_chat_completions. Derived from the request path the transport
    # actually posted to, not from behavior configuration.
    source: String @immutable
    # Canonical JSON of the complete provider request body, captured at the
    # transport seam: the last point at which the body exists before the HTTP
    # send, after the ChatGPT-Codex instructions/store/strict rewrite, after
    # Grok's `store:false` injection, and after Responses assistant-item
    # normalization. This is the conformance oracle every reconstruction is
    # compared against, and it is what the provider received rather than what
    # the loop assembled.
    request_json: String @immutable
    # Query indexes only: dedup, "every capture sharing this tool surface", and
    # prefix-stability analysis. prompt_hash covers `messages` for Chat
    # Completions and the complete `instructions` + `input` prompt surface for
    # Responses. Explicitly NOT an integrity mechanism — see the field commit
    # CID note above.
    prompt_hash: String @index @immutable
    tools_hash: String @index @immutable
    # Versioned provenance manifest. Never an overloaded empty map: absent
    # required provenance reads as CapturedOnly, not as evidence of
    # reconstructibility.
    provenance_json: String @immutable
    created_at: DateTime @index @immutable
}
