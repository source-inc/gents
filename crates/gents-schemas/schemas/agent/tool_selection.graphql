type ToolSelection {
    selection_id: String @index(unique: true)
    agent_did: String @index
    display_name: String
    tool_policy_version: String
    enable_file_tools: Boolean
    file_tools_mode: String
    file_tool_root: String
    enable_bash: Boolean
    bash_mode: String
    command_execution_policy: String
    # Argv-prefix allow gate (extend / subcommand-precise). Non-empty = global
    # gate; matching prefix also admits heads outside the base allowlist in
    # ReadOnly mode. Prefer for extending. See docs/macos-bash-sandbox.md.
    command_allowed_argv_prefixes: [String]
    # Argv prefixes always denied (wins over allowed + read-only allowlist).
    command_forbidden_argv_prefixes: [String]
    # When non-empty, replaces default_read_only_commands() wholesale
    # (whole-executable). Prefer for narrowing/customizing the base.
    # See docs/macos-bash-sandbox.md.
    read_only_command_allowlist: [String]
    command_network_mode: String
    cli_tool_names: [String]
    enable_meta_tools: Boolean
    allowed_mcp_service_ids: [String]
    # deprecated: delegate_to_agent removed; field retained for schema-compat, unused.
    delegate_to: [String]
    backgroundable_tool_names: [String]
    # Tool names that require an AgentToolApproval document before dispatch.
    # A matched call holds in lifecycle_state "awaitingApproval" until an
    # operator approves/denies or the call deadline expires.
    approval_required_tools: [String]
    subagent_targets: [String]
    subagent_spawn_enabled: Boolean
    orchestration_enabled: Boolean
    subagent_steering_enabled: Boolean
    subagent_background_enabled: Boolean
    subagent_default_await_mode: String
    subagent_allow_cross_deployment: Boolean
    cross_deployment_spawn_timeout_seconds: Int
    enable_memory: Boolean
    enable_session_history_tool: Boolean
    enable_context_budget: Boolean
    enable_defra_query: Boolean
    defra_query_collections: [String]
    write_tools: [String]
    # Bare surface_id refs to DatastoreToolSurface (same agent). Expanded
    # into WriteToolDecl create tools at snapshot build; fail-closed.
    datastore_tool_surface_ids: [String]
    # Self-configuration gate (#654): opt-in, never backfilled true.
    enable_self_config: Boolean
    # Category allowlist: behavior, tools, profile, backend, mcp_service,
    # automation. Unset means the core spine (behavior, tools, profile).
    self_config_categories: [String]
    # Opt-in guardrail: refuse a self-config patch that would strip the
    # agent's own reconfigure ability.
    self_config_no_lockout: Boolean
    # Opt-in guardrail: get_my_config accepts a patch preview (diff without
    # committing).
    self_config_dry_run: Boolean
    updated_at: DateTime @index(direction: DESC)
}
