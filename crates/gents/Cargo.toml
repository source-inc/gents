[package]
name = "gents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core DefraDB-backed agent runtime for Gents"
build = "build.rs"

[features]
# Gents executes Lens migrations at runtime, so keep Wasmtime explicit while
# omitting DefraDB's SourceHub ACP and legacy libp2p defaults.
default = [
    "defra-node/http",
    "defra-node/p2p",
    "defra-node/wasmtime-runtime",
    "lark",
]
agent-memory = []
lark = ["defra-node/lark"]
# Gates the e2e_live test binary out of default builds: every test in it is
# live-inference-gated, so default runs paid a ~160MB link to execute nothing.
live-e2e = []

# All other test binaries are auto-discovered; this explicit target overrides
# autodiscovery for e2e_live so the link only happens on live runs
# (`cargo test -p gents --features live-e2e --test e2e_live -- --ignored`).
[[test]]
name = "e2e_live"
path = "tests/e2e_live.rs"
required-features = ["live-e2e"]

[dependencies]
anyhow.workspace = true
async-stream = "0.3"
async-trait = "0.1"
base64.workspace = true
bs58 = "0.5"
bytes.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
crypto.workspace = true
defra-core.workspace = true
defra-p2p-adapter.workspace = true
gents-fs-runner = { path = "../gents-fs-runner" }
gents-protocol.workspace = true
gents-migration = { path = "../gents-migration" }
defra-node.workspace = true
dirs.workspace = true
events.workspace = true
futures = "0.3"
hostname.workspace = true
identity.workspace = true
libc = "0.2"
minijinja.workspace = true
opentelemetry.workspace = true
p2p.workspace = true
query.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
regex = "1"
schemars = "1"
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
wasmtime = { version = "46.0.2", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
] }
rig-core.workspace = true
reqwest.workspace = true
rmcp = { version = "1.2.0", features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
tokio-util = "0.7"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
acp.workspace = true
axum = "0.8"
defra-node = { workspace = true, features = ["redb"] }
proptest = "1"
tar = "0.4"
zstd = "0.13"
gents-lean-contract.workspace = true
gents-callback-fixture-create-workspace = { path = "../gents-callbacks/fixture_create_workspace", default-features = false }
jsonschema = { version = "0.46.5", default-features = false }
wat = "1.254"
