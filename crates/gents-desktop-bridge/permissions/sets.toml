"$schema" = "schemas/schema.json"

# Capability-scoped permission sets (design § Capability-scoped permissions).
# Autogenerated allow-<command> permissions are produced by build.rs.
# `default.toml` also ships a composed minimal default (core + client-lifecycle).

[[set]]
identifier = "core"
description = "Contract, bootstrap summary, aggregate snapshot, observer metrics"
permissions = [
  "allow-desktop-bridge-contract",
  "allow-desktop-bootstrap-summary",
  "allow-desktop-client-snapshot",
  "allow-desktop-observer-metrics",
]

[[set]]
identifier = "client-lifecycle"
description = "Client start/shutdown and selected-agent"
permissions = [
  "allow-desktop-client-start",
  "allow-desktop-client-shutdown",
  "allow-desktop-set-selected-agent",
]

[[set]]
identifier = "session-read"
description = "Session/conversation snapshot read"
permissions = ["allow-desktop-session-snapshot"]

[[set]]
identifier = "trace-read"
description = "Request timeline read"
permissions = ["allow-desktop-request-timeline"]

[[set]]
identifier = "tool-surface-read"
description = "Tool-surface explain (config family)"
permissions = ["allow-desktop-tool-surface-explain"]

[[set]]
identifier = "chat-write"
description = "Chat send and rename"
permissions = [
  "allow-desktop-chat-send",
  "allow-desktop-conversation-rename",
]

[[set]]
identifier = "resend-control"
description = "Request resend / retry"
permissions = [
  "allow-desktop-request-resend",
  "allow-desktop-request-retry",
]

[[set]]
identifier = "fleet-read"
description = "Peer status (by saved id) and network status"
permissions = [
  "allow-desktop-peer-status-fetch",
  "allow-desktop-network-status",
]

[[set]]
identifier = "workspace-read"
description = "Workspace browser"
permissions = ["allow-desktop-workspace-list"]

[[set]]
identifier = "fleet-admin"
description = "Peer add/remove/rename, bearer pairing, address probe, P2P repair"
permissions = [
  "allow-desktop-peer-add",
  "allow-desktop-peer-pair-bearer",
  "allow-desktop-peer-remove",
  "allow-desktop-peer-rename",
  "allow-desktop-peer-probe-address",
  "allow-desktop-p2p-repair",
]

[[set]]
identifier = "operations-read"
description = "Operations snapshot, health, subagent tree, MCP probe"
permissions = [
  "allow-desktop-operations-snapshot",
  "allow-desktop-list-subagent-tree",
  "allow-desktop-list-backends-with-health",
  "allow-desktop-list-mcp-services-with-health",
  "allow-desktop-probe-mcp-service",
]

[[set]]
identifier = "interrupt-read"
description = "Interrupt cascade preview"
permissions = ["allow-desktop-preview-interrupt-cascade"]

[[set]]
identifier = "interrupt-control"
description = "Interrupt request execution"
permissions = ["allow-desktop-interrupt-request"]

[[set]]
identifier = "holds-read"
description = "List tool-call holds"
permissions = ["allow-desktop-list-tool-call-holds"]

[[set]]
identifier = "holds-control"
description = "Resolve tool-call holds"
permissions = ["allow-desktop-resolve-tool-call-hold"]

[[set]]
identifier = "runtime-admin"
description = "Local runtime provisioning and managed server lifecycle"
permissions = [
  "allow-desktop-init-local-standard",
  "allow-desktop-managed-server-status",
  "allow-desktop-managed-server-start",
  "allow-desktop-managed-server-stop",
]

[[set]]
identifier = "config-write"
description = "Config save/delete/test mutations"
permissions = [
  "allow-desktop-agent-config-save",
  "allow-desktop-behavior-save",
  "allow-desktop-skill-save",
  "allow-desktop-skill-delete",
  "allow-desktop-task-delete",
  "allow-desktop-schedule-delete",
  "allow-desktop-event-trigger-delete",
  "allow-desktop-backend-delete",
  "allow-desktop-inference-profile-delete",
  "allow-desktop-tool-selection-delete",
  "allow-desktop-tool-service-delete",
  "allow-desktop-behavior-delete",
  "allow-desktop-backend-save",
  "allow-desktop-inference-profile-save",
  "allow-desktop-tool-selection-save",
  "allow-desktop-tool-service-save",
  "allow-desktop-tool-service-test",
  "allow-desktop-probe-inference-endpoint",
  "allow-desktop-codex-login",
  "allow-desktop-codex-login-cancel",
  "allow-desktop-grok-login",
  "allow-desktop-grok-login-cancel",
  "allow-desktop-provider-account-disconnect",
]

[[set]]
identifier = "provider-accounts-read"
description = "Read redacted provider account metadata"
permissions = ["allow-desktop-provider-accounts-list"]

[[set]]
identifier = "tasks"
description = "Task/schedule/event-trigger save and run"
permissions = [
  "allow-desktop-task-save",
  "allow-desktop-schedule-save",
  "allow-desktop-schedule-run",
  "allow-desktop-event-trigger-save",
  "allow-desktop-task-run",
]

[[set]]
identifier = "native-e2e"
description = "Debug-only native E2E commands"
permissions = [
  "allow-desktop-native-e2e-config",
  "allow-desktop-native-e2e-status",
]

[[set]]
identifier = "full"
description = "Full Gents Desktop production surface (excludes native-e2e)"
permissions = [
  "default",
  "runtime-admin",
  "session-read",
  "trace-read",
  "tool-surface-read",
  "chat-write",
  "resend-control",
  "fleet-read",
  "workspace-read",
  "fleet-admin",
  "operations-read",
  "interrupt-read",
  "interrupt-control",
  "holds-read",
  "holds-control",
  "config-write",
  "provider-accounts-read",
  "tasks",
]
