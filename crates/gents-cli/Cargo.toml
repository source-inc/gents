[package]
name = "gents-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for the Gents runtime"
autobins = false

[lib]
name = "gents_server"
path = "src/lib.rs"

[[bin]]
name = "gents"
path = "src/main.rs"

[features]
# Gates the live-inference test binary out of default builds: every test in
# cli_live_suite is #[ignore]d behind env gates, so default runs paid a
# full gents+defradb+iroh link to execute nothing.
live-e2e = []

# All other test binaries are auto-discovered; this explicit target overrides
# autodiscovery for cli_live_suite so its link only happens on live runs
# (`cargo test -p gents-cli --features live-e2e --test cli_live_suite -- --ignored`).
[[test]]
name = "cli_live_suite"
path = "tests/cli_live_suite.rs"
required-features = ["live-e2e"]

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
bs58 = "0.5"
chrono.workspace = true
ciborium = "0.2"
clap.workspace = true
gents-chatgpt-login.workspace = true
gents-claude-login.workspace = true
gents-codex-protocol.workspace = true
gents = { path = "../gents" }
gents-fs-runner = { path = "../gents-fs-runner" }
gents-protocol.workspace = true
defra-node.workspace = true
defra-p2p-adapter.workspace = true
futures-util = "0.3"
flate2 = "1"
ignore = "0.4"
iroh.workspace = true
query.workspace = true
hostname.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
p2p.workspace = true
regex = "1"
reqwest.workspace = true
rmcp = { version = "1.2.0", features = [
    "server",
    "transport-streamable-http-server",
    "macros",
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
serde_yaml.workspace = true
subtle.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
url = "2"

[dev-dependencies]
acp.workspace = true
async-trait = "0.1"
gents-desktop-core.workspace = true
gents-lean-contract.workspace = true
identity.workspace = true
jsonschema = { version = "0.46.5", default-features = false }
tempfile = "3"
tokio-tungstenite = "0.26.2"
