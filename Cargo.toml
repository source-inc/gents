[workspace]
resolver = "2"
members = [
    "apps/fixture-host/src-tauri",
    "apps/gents-desktop/src-tauri",
    "crates/fixture-domain-plugin",
    "crates/gents",
    "crates/gents-chatgpt-login",
    "crates/gents-claude-login",
    "crates/gents-cli",
    "crates/gents-codex-protocol",
    "crates/gents-desktop",
    "crates/gents-desktop-bridge",
    "crates/gents-desktop-core",
    "crates/gents-lean-contract",
    "crates/gents-migration",
    "crates/gents-lenses/fixture_add_label",
    "crates/gents-callbacks/fixture_create_workspace",
    "crates/gents-fs-runner",
    "crates/gents-protocol",
    "crates/gents-schemas",
]
# Patched noq 1.1.1 (gents#634) is pulled only via [patch.crates-io].
# Keep it out of the workspace so `cargo fmt --all` / workspace tests don't own
# upstream style; each crate has a local empty [workspace] for standalone tests.
exclude = [
    "third_party/noq",
]
default-members = [
    "apps/fixture-host/src-tauri",
    "apps/gents-desktop/src-tauri",
    "crates/fixture-domain-plugin",
    "crates/gents",
    "crates/gents-chatgpt-login",
    "crates/gents-claude-login",
    "crates/gents-cli",
    "crates/gents-codex-protocol",
    "crates/gents-desktop",
    "crates/gents-desktop-bridge",
    "crates/gents-desktop-core",
    "crates/gents-migration",
    "crates/gents-protocol",
    "crates/gents-schemas",
]

[workspace.package]
version = "0.15.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/gents-ai/gents"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
# DefraDB v0.19.0 replaces the retired storage backends with Regolith and binds
# gossip fetch obligations to transport-routable origins. Its iterative
# parent-DAG replay remains required on iOS: a deep collection history otherwise
# exhausts even a 32 MiB Tokio worker stack.
acp = { git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "03e1035f364dc0914016e9cf8bde4e4f1a000f06" }
crypto = { git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "03e1035f364dc0914016e9cf8bde4e4f1a000f06" }
defra-core = { git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "03e1035f364dc0914016e9cf8bde4e4f1a000f06" }
gents-protocol = { path = "crates/gents-protocol" }
gents-chatgpt-login = { path = "crates/gents-chatgpt-login" }
gents-claude-login = { path = "crates/gents-claude-login" }
gents-codex-protocol = { path = "crates/gents-codex-protocol" }
gents-schemas = { path = "crates/gents-schemas" }
gents-desktop-core = { path = "crates/gents-desktop-core" }
gents-desktop-bridge = { path = "crates/gents-desktop-bridge" }
gents-lean-contract = { path = "crates/gents-lean-contract" }
# Keep DefraDB defaults off: Gents selects Iroh P2P and Lens execution without
# SourceHub ACP or the legacy libp2p transport (defradb.rs#1431-#1435).
defra-node = { git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "03e1035f364dc0914016e9cf8bde4e4f1a000f06", default-features = false }
defra-p2p-adapter = { git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "03e1035f364dc0914016e9cf8bde4e4f1a000f06", default-features = false }
dirs = "5"
events = { git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "03e1035f364dc0914016e9cf8bde4e4f1a000f06" }
hostname = "0.4"
identity = { git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "03e1035f364dc0914016e9cf8bde4e4f1a000f06" }
# Must stay version-aligned with the iroh used by the defradb.rs `p2p` crate;
# the CLI uses it to inspect the default relay set at startup (#588).
iroh = "1"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde", "unstable_machinery"] }
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
p2p = { git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "03e1035f364dc0914016e9cf8bde4e4f1a000f06" }
query = { git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "03e1035f364dc0914016e9cf8bde4e4f1a000f06" }
storage = { git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "03e1035f364dc0914016e9cf8bde4e4f1a000f06" }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rig-core = "0.35.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-opentelemetry = { version = "0.32.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
# On the dedicated M4 release host, disabling LTO with 16 CGUs cut a fresh-target
# CLI build from 836s to 209s. The gzip-9 artifact also shrank 3.5% (27.8 MB to
# 26.8 MB); only the uncompressed binary grew, from 62.1 MB to 70.7 MB.
lto = "off"
codegen-units = 16
panic = "abort"
# Shipped binaries stay compact. The macOS release workflow overrides this
# while linking, extracts a matching dSYM, then strips before signing.
strip = true
overflow-checks = true
debug = "line-tables-only"

[profile.dev-install]
inherits = "release"
lto = "off"
codegen-units = 16
strip = false

[profile.dev.package."*"]
opt-level = 1

# Agent and batch worktrees generally need actionable backtraces, not complete
# dependency DWARF. Keep the default dev profile available for debugger-heavy
# work while giving repeated build/link loops a smaller opt-in artifact set.
[profile.fast-dev]
inherits = "dev"
debug = "line-tables-only"

[profile.fast-dev.package."*"]
opt-level = 1
debug = 0

[profile.test]
# At opt-level 1 Cargo's implicit `lto = false` still performs local ThinLTO.
# CI enables incremental compilation on persistent runner target trees; keeping
# codegen units independent avoids stale ThinLTO imports and shortens links.
lto = "off"
opt-level = 1
debug = 0
split-debuginfo = "off"
incremental = false

[patch.crates-io]
# rig-core fork: upstream rig's OpenAI provider drops reasoning from vLLM-style
# servers. The Responses streaming decoder only handles OpenAI's hosted
# `response.reasoning_summary_text.delta`; vLLM streams the raw chain-of-thought
# as `response.reasoning_text.delta`, which rig has no variant for (also a
# `reasoning` vs `reasoning_content` mismatch on Chat Completions). Without the
# fork our Responses-API reasoning capture is silently empty.
rig-core = { git = "https://github.com/sourcenetwork/rig", rev = "1ebeeaee3b569bb6e242e000c11df1ed2c0cca90" }
# noq 1.1.1 includes the stale-path and duplicate-Draining fixes, and
# n0-computer/noq#723 has been closed. Keep the two endpoint Drop paths from
# aborting the process when an earlier driver panic poisons their mutex.
# See third_party/README.md, defradb.rs#1090, and gents#634.
noq = { path = "third_party/noq" }
